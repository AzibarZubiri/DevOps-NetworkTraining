services:
  db:
    image: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: secreto
      MARIADB_DATABASE: eschaton
      MARIADB_USER: pemulis
      MARIADB_PASSWORD: bobhope
    networks:
      - backend
    volumes:
      - db_datos:/var/lib/mysql
    healthcheck:
      test:  ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
    networks:
      - backend
      - frontend
    ports:
      - "8082:80"

  wordpress:
    image: wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: pemulis
      WORDPRESS_DB_PASSWORD: bobhope
      WORDPRESS_DB_NAME: eschaton
    volumes:
      - wp_datos:/var/www/html
    networks:
      - backend
      - frontend
    ports:
      - "8000:80"

networks:
  backend:
  frontend:

volumes:
  db_datos:
  wp_datos:
